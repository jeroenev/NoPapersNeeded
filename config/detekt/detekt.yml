# detekt 2.0 configuration. Layered on top of the built-in defaults (buildUponDefaultConfig = true),
# so only overrides are listed here. Tuned for a Kotlin Multiplatform + Compose codebase.
#
# The defaults exempt test code from some rules by path, but only the source sets of other builds
# (jvmTest, androidUnitTest, ...). `&testSources` names this build's, and every rule that leaves tests
# alone uses it (`*testSources`), so a test is held to the same rules whichever source set it is in.

complexity:
  LongMethod:
    allowedLines: 80
    # A composable's length measures the depth of its UI tree, not its complexity.
    ignoreAnnotated: ["Composable"]
  LongParameterList:
    # Compose composables and DI wiring legitimately take many parameters.
    allowedFunctionParameters: 9
    allowedConstructorParameters: 12
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    allowedComplexity: 20
    # An exhaustive when over a sealed type (one branch per case) is readable, not complex.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20
    # An actions interface lists every public function of the viewmodel implementing it, which
    # ignorePrivate does not shrink, so it is not split into sub-interfaces nothing else implements
    # (LibraryActions has 21).
    allowedFunctionsPerInterface: 22
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 20
    ignoreOverridden: true
    # A class's size is its API: a private helper that removes a duplicate should not push it over.
    ignorePrivate: true
    excludes: &testSources
      - '**/commonTest/**'
      - '**/desktopTest/**'
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'
      - '**/androidTest/**'
      - '**/test/**'
    # A Room DAO is one method per query; splitting it by count would scatter one table's SQL.
    ignoreAnnotated: ["Dao"]
  NestedBlockDepth:
    allowedDepth: 5

style:
  MagicNumber:
    # Compose UI uses many dp/sp/weight literals; enforcing this everywhere is noise.
    active: false
  ReturnCount:
    max: 5
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  ForbiddenMethodCall:
    # Needs type resolution, so only the typed run checks it. Tests may block and print.
    active: true
    excludes: *testSources
    methods:
      - reason: 'Report through NpnLog (`log.runLogged`), which the app can route and tests can read.'
        value: 'kotlin.io.print'
      - reason: 'Report through NpnLog (`log.runLogged`), which the app can route and tests can read.'
        value: 'kotlin.io.println'
      - reason: 'Blocks the calling thread, which may be the main thread; suspend or launch instead.'
        value: 'kotlinx.coroutines.runBlocking'
      - reason: 'Blocks the calling thread; use delay in a coroutine.'
        value: 'java.lang.Thread.sleep'
      # detekt's defaults, which a methods list replaces.
      - reason: 'using `BigDecimal(Double)` can result in unexpected floating point precision behavior. Use `BigDecimal.valueOf(Double)` or `String.toBigDecimalOrNull()` instead.'
        value: 'java.math.BigDecimal.<init>(kotlin.Double)'
      - reason: 'using `BigDecimal(String)` can result in a `NumberFormatException`. Use `String.toBigDecimalOrNull()`'
        value: 'java.math.BigDecimal.<init>(kotlin.String)'
      - reason: 'It is marked as obsolete. Use `kotlin.time.measureTime` instead.'
        value: 'kotlin.system.measureTimeMillis'
  ForbiddenComment:
    # Flag leftover FIXME so they are tracked.
    active: true
    comments:
      - reason: "Track and resolve before release"
        value: "FIXME"

naming:
  MatchingDeclarationName:
    # The defaults plus `desktop`, the name of this build's JVM target (`Foo.desktop.kt`).
    multiplatformTargets:
      - 'ios'
      - 'android'
      - 'js'
      - 'jvm'
      - 'native'
      - 'iosArm64'
      - 'iosX64'
      - 'macosX64'
      - 'mingwX64'
      - 'linuxX64'
      - 'desktop'
  FunctionNaming:
    # Composable functions are PascalCase by convention; test functions use backtick names.
    ignoreAnnotated: ["Composable"]
    excludes: ["**/commonTest/**", "**/desktopTest/**", "**/androidUnitTest/**", "**/test/**"]

coroutines:
  GlobalCoroutineUsage:
    # Work outlives its owner and escapes structured cancellation; use the app or session scope.
    active: true
  InjectDispatcher:
    # A test picks the real dispatcher it needs on the spot; nothing would ever inject another.
    excludes: *testSources
  SuspendFunSwallowedCancellation:
    # A catch-all around a suspend call also catches CancellationException and so breaks
    # structured cancellation. Needs type resolution, so only the typed tasks run it.
    active: true

potential-bugs:
  ElseCaseInsteadOfExhaustiveWhen:
    # A `when` over a sealed or enum type of ours names every case, so a new op, path or kind is a
    # compile error at each place that must decide about it. Koog's types are left out: they grow
    # with the library, and the code reads only the few cases it needs.
    active: true
    ignoredSubjectTypes:
      - 'ai.koog.prompt.message.Message'
      - 'ai.koog.prompt.message.MessagePart'
      - 'ai.koog.prompt.streaming.StreamFrame'
  UnsafeCallOnNullableType:
    excludes: *testSources

performance:
  ForEachOnRange:
    excludes: *testSources
  SpreadOperator:
    excludes: *testSources

exceptions:
  InstanceOfCheckForException:
    excludes: *testSources
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: false

comments:
  active: false

config:
  # The Compose section below is read by the typed run, which loads the Compose ruleset; the
  # source-only run does not have it and could not validate its keys.
  excludes: ["Compose.*"]

# The Compose ruleset, loaded by the typed run only.
Compose:
  CompositionLocalAllowlist:
    # Deliberate implicit dependencies: the window's width class, decided once at the root, the
    # document scanner the platform entry point provides, and the library's one store of unsaved
    # document drafts, which the editors, the resume banner and Settings all read.
    allowedCompositionLocals:
      - LocalWindowWidthClass
      - LocalDocumentScanner
      - LocalDocumentDrafts
