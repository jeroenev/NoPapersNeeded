# mise task runner for no-papers-needed.
# Run `mise tasks` to list, `mise run <task>` (or `mise <task>`) to execute.
# See https://mise.jdx.dev/tasks/ for details.

[env]
# Android package ids used by the deploy/uninstall tasks. The debug build has its own package so
# it installs next to the release build.
ANDROID_APP_ID = "io.github.jeroenev.NoPapersNeeded"
ANDROID_APP_ID_DEBUG = "io.github.jeroenev.NoPapersNeeded.debug"
ANDROID_ACTIVITY = "dev.npn.MainActivity"

# Only needed by `mise icons`, which re-renders the committed desktop icons from
# design/branding/icon.svg. Nothing in the Gradle build depends on these.
[tools]
resvg = "0.49"
uv = "latest"

# --- Android build ---------------------------------------------------------

[tasks.baseline-profile]
description = "Regenerate the Android baseline profile on the connected device (Android 13+)"
run = "./gradlew :androidApp:generateBaselineProfile"

[tasks.apk]
description = "Build the Android debug APK (cross-compiles the bundled rclone; needs Go + NDK)"
run = "./gradlew :androidApp:assembleDebug"

[tasks.rclone-android]
description = "Cross-compile the bundled rclone for Android into jniLibs (needs Go + the NDK)"
run = "./gradlew :androidApp:buildRcloneAndroid"

[tasks.apk-release]
description = "Build the Android release APK (signed when NPN_KEYSTORE_* is set, else unsigned)"
run = "./gradlew :androidApp:assembleRelease"

[tasks.bundle]
description = "Build the Android release App Bundle (.aab)"
run = "./gradlew :androidApp:bundleRelease"

# `mise deploy` builds and installs over adb (USB or Wi-Fi), then launches.
# Defined as a file task in .mise/tasks/deploy for the multi-step logic.

[tasks.uninstall]
description = "Uninstall the debug build from the connected device"
run = "adb uninstall $ANDROID_APP_ID_DEBUG"

[tasks.uninstall-release]
description = "Uninstall the release build from the connected device"
run = "adb uninstall $ANDROID_APP_ID"

# --- Android wireless ------------------------------------------------------

# `mise pair` walks through one-time adb Wi-Fi pairing, and `mise connect <ip:port>` reconnects
# an already-paired device (file tasks in .mise/tasks/).

[tasks.devices]
description = "List connected/paired adb devices"
run = "adb devices -l"

# --- Fast UI iteration -----------------------------------------------------

[tasks.hot]
description = "Compose Hot Reload on desktop, auto-reload on save (fast UI iteration)"
run = "./gradlew :desktopApp:hotRun --auto"

[tasks.desktop]
description = "Run the desktop app from source (no hot reload)"
run = "./gradlew :desktopApp:run"

# --- Desktop packaging -----------------------------------------------------

[tasks.package-deb]
description = "Build a Linux .deb native distribution"
run = "./gradlew :desktopApp:packageDeb"

[tasks.package-rpm]
description = "Build a Linux .rpm native distribution (needs rpmbuild)"
run = "./gradlew :desktopApp:packageRpm"

[tasks.package-appimage]
description = "Build a Linux AppImage (downloads appimagetool on first run)"
run = "./gradlew :desktopApp:packageAppImage"

# `mise package-flatpak` builds a .flatpak bundle with flatpak-builder, and
# `mise flathub-manifest [version]` writes the Flathub manifest for a published release (file
# tasks in .mise/tasks/).

[tasks.package-jar]
description = "Build a self-contained runnable uber JAR"
run = "./gradlew :desktopApp:packageUberJarForCurrentOS"

# `mise release <version>` bumps npn.version, commits, tags v<version> and pushes; the tag
# triggers .github/workflows/release.yml (file task in .mise/tasks/release).

# `mise pages-preview` assembles the GitHub Pages site and serves it locally
# (file task in .mise/tasks/pages-preview).

# `mise icons` re-renders the committed desktop icon bitmaps from the branding SVG
# (file task in .mise/tasks/icons).

# --- Tests & checks --------------------------------------------------------

[tasks.test]
description = "Run the core test suite"
run = "./gradlew :core:desktopTest"

[tasks.test-fast]
description = "Run the core and shared UI desktop tests"
run = "./gradlew :core:desktopTest :composeApp:desktopTest"

# The cloud sync qualification scenarios (docs/SYNC_QUALIFICATION.md). They drive the real engine
# over a fake remote, so they need no credentials and touch no provider.
[tasks.sync-scenarios]
description = "Run the cloud sync qualification scenarios against fake remotes"
run = "./gradlew :core:desktopTest --tests 'dev.npn.core.sync.SyncScenarioTest'"

# allTests runs every multiplatform module's suites on both targets; the desktop shell and the
# build logic have plain JVM test tasks of their own.
[tasks.test-all]
description = "Run every test suite: both targets, the desktop shell and the build logic"
run = "./gradlew allTests :desktopApp:test :buildSrc:test"

[tasks.test-device]
description = "Run Android instrumentation tests on a connected device (storage, lifecycle, sharing and network)"
run = "./gradlew :core:connectedAndroidDeviceTest :composeApp:connectedAndroidDeviceTest :androidApp:connectedDebugAndroidTest"

[tasks.check]
description = "Run all checks (tests + lint) across every module"
run = "./gradlew check"

[tasks.build]
description = "Assemble and test every module"
run = "./gradlew build"

[tasks.clean]
description = "Delete all build outputs"
run = "./gradlew clean"

[tasks.hooks-install]
description = "Use the repository's version-controlled Git hooks"
run = "git config --local core.hooksPath .githooks"
