name: CodeQL

# A full build plus analysis takes ~17 minutes. It runs on pull requests and pushes to main, and
# weekly, so new CodeQL queries reach code that has not changed. Results go to the repository's
# code scanning alerts (the Security tab).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read # the CodeQL action reads its own workflow run
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: manual

      # Kotlin compilation only: CodeQL extracts from the compiler, so dexing and packaging add
      # build time without adding anything to the database.
      - name: Compile Android and desktop code
        run: ./gradlew :androidApp:compileDebugKotlin :desktopApp:compileKotlin

      # Leftover Gradle and Kotlin daemons (4 GB + 3 GB heaps) would hold memory CodeQL's analysis
      # wants, which sizes its RAM budget from the runner's total.
      - name: Stop build daemons
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:java-kotlin"
