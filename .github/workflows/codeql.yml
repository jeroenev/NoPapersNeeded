name: CodeQL

# A full build plus analysis takes ~17 minutes, so this runs weekly and on demand only.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read # the CodeQL action reads its own workflow run; required on private repos
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual

      # Kotlin compilation only: CodeQL extracts from the compiler, so dexing and packaging add
      # build time without adding anything to the database.
      - name: Compile Android and desktop code
        run: ./gradlew :androidApp:compileDebugKotlin :desktopApp:compileKotlin

      # The private-repo runner has ~8 GB. Leftover Gradle and Kotlin daemons (4 GB + 3 GB heaps)
      # plus CodeQL's default RAM budget exhaust it, and the runner gets killed mid-analysis.
      - name: Stop build daemons
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true

      # Code scanning is not enabled on this private repo (it needs GitHub Code Security), so
      # results are kept as an artifact instead of uploaded.
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          ram: 5500
          upload: never
          output: sarif-results

      - name: Upload SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 7
