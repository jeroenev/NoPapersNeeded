name: Windows desktop build

# Windows runners bill at twice the Linux rate, and spotless/detekt/localization are already
# covered by ci.yml, so this runs weekly and on demand rather than on every push. It focuses on
# the desktop target where Windows-specific issues (java.nio, jlink/jpackage/WiX) can surface.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 17 builds and runs Gradle (the last version listed is the default); 25 is the runtime
      # jlink/jpackage bundle with the desktop app, found by Gradle's toolchain detection.
      - name: Set up JDK 17 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Tests (desktop)
        run: ./gradlew.bat :core:desktopTest :composeApp:desktopTest

      - name: Package Windows installers (MSI + Exe)
        run: ./gradlew.bat :desktopApp:packageDistributionForCurrentOS

      - name: Upload Windows installer artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: no-papers-needed-windows-installers
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          retention-days: 7

      - name: Upload core test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-core-test-reports
          path: core/build/reports/tests/desktopTest
          retention-days: 7
