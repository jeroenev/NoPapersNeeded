name: Windows desktop build

# Windows runners bill at twice the Linux rate, and spotless/detekt/localization are already
# covered by ci.yml, so this runs weekly and on demand rather than on every push. It focuses on
# the desktop target where Windows-specific issues (java.nio, jlink/jpackage/WiX) can surface.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # All of core, since much of it runs on real files and the bundled SQLite.
      - name: Core tests
        run: ./gradlew.bat :core:desktopTest

      # packageMsi/packageExe go straight to installers; createDistributable also leaves the app
      # image in build/compose/binaries/main/app for the Tesseract check below.
      - name: Package Windows installers (MSI + Exe)
        run: ./gradlew.bat :desktopApp:createDistributable :desktopApp:packageDistributionForCurrentOS

      - name: Check the bundled Tesseract
        shell: bash
        run: bash .github/scripts/check-bundled-tesseract.sh

      - name: Upload Windows installer artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: no-papers-needed-windows-installers
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          retention-days: 7

      - name: Upload core test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-core-test-reports
          path: core/build/reports/tests/desktopTest
          retention-days: 7

      # Windows will not let another process read a file the Gradle daemon holds open, so with the
      # daemon still running setup-gradle's post step cannot archive the Gradle User Home and the
      # cache is never saved.
      - name: Stop the Gradle daemon
        if: always()
        run: ./gradlew.bat --stop
