name: Windows desktop build

# Windows runners bill at twice the Linux rate, and spotless/detekt/localization are already
# covered by ci.yml, so this runs weekly and on demand rather than on every push. It focuses on
# the desktop target where Windows-specific issues (java.nio, jlink/jpackage/WiX) can surface.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Only the packages whose behaviour depends on the OS: the real filesystem (paths,
      # no-replace publication, trash, moves), the bundled SQLite, the file watcher, Tesseract
      # and PDFBox file I/O. Domain logic, AI and viewmodel tests behave identically on every
      # JVM and already run in ci.yml.
      - name: Tests (platform-specific)
        shell: bash
        run: >-
          ./gradlew.bat :core:desktopTest
          --tests 'dev.npn.core.fs.*'
          --tests 'dev.npn.core.db.*'
          --tests 'dev.npn.core.index.*'
          --tests 'dev.npn.core.watch.*'
          --tests 'dev.npn.core.ocr.*'
          --tests 'dev.npn.core.pdf.*'
          --tests 'dev.npn.core.xmp.*'

      # packageMsi/packageExe go straight to installers; createDistributable also leaves the app
      # image in build/compose/binaries/main/app for the Tesseract check below.
      - name: Package Windows installers (MSI + Exe)
        run: ./gradlew.bat :desktopApp:createDistributable :desktopApp:packageDistributionForCurrentOS

      # The bundled Tesseract (prepareWindowsTesseract) has to start on Windows: a DLL missing
      # from the bundle would only show up as silently empty OCR on users' machines.
      - name: Check the bundled Tesseract
        shell: bash
        run: |
          tess=$(find desktopApp/build/compose/binaries -name tesseract.exe | head -n 1)
          test -n "$tess" || { echo "No tesseract.exe in the app image"; exit 1; }
          du -sh "$(dirname "$tess")"
          langs=$(TESSDATA_PREFIX="$(dirname "$tess")/tessdata" "$tess" --list-langs | tr -d '\r')
          echo "$langs"
          for lang in eng nld deu fra spa por; do grep -qx "$lang" <<<"$langs"; done

      - name: Upload Windows installer artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: no-papers-needed-windows-installers
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe
          retention-days: 7

      - name: Upload core test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-core-test-reports
          path: core/build/reports/tests/desktopTest
          retention-days: 7

      # Windows will not let another process read a file the Gradle daemon holds open, so with the
      # daemon still running setup-gradle's post step cannot archive the Gradle User Home and the
      # cache is never saved.
      - name: Stop the Gradle daemon
        if: always()
        run: ./gradlew.bat --stop
