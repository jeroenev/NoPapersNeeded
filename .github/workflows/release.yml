name: Release

# Cut with `mise release <version>`, which bumps npn.version and pushes the matching v<version> tag
# (or, for the first release, tags the commit that already carries it). Binaries go straight onto a
# draft release (release assets do not count against the Actions
# artifact quota), and the draft is published only once every platform has uploaded. Tests are not
# rerun here, and nothing waits for CI on the tagged commit: `mise release` refuses unless CI passed
# on the main commit it bumps, and the tagged commit changes only npn.version. The draft job holds
# every tag to that before anything is built (.github/scripts/check-release-commit.sh): CI passed on
# the tagged commit itself, or it changes only the npn.version line on top of a main commit CI
# passed on. CI passed on a commit when a push or manual ci.yml run on it succeeded; a pull_request
# run tested the pull request merged into its base branch, not the commit itself.
#
# Everything before 1.0.0 is a beta: the version cannot say so (jpackage/MSI only take plain
# numbers), so the channel follows the major version and 0.x is published as a pre-release. That
# keeps a beta out of GitHub's "latest", which the AppImage's zsync update info and Flathub's
# x-checker read, while a 0.x build's own update check looks for pre-releases too.
#
# Secrets are scoped to the steps that need them: GH_TOKEN (contents: write, plus actions: read in
# the draft job for that check) to the steps that call `gh`, the signing key to the one Gradle run
# that signs the APK. Every other step, including the downloaded tools the packaging runs
# (appimagetool, flatpak-builder) and the Go build of the APK's rclone, runs without them. Actions are pinned to a commit, with the
# release they came from in a comment. The build jobs restore no Gradle cache (`cache-disabled`):
# the other workflows save theirs on main, and Gradle re-verifies neither the distribution nor the
# jars a restored home holds, so the signing step and every package build would run whatever those
# wrote. The wrapper instead downloads Gradle and checks its
# distributionSha256Sum.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    name: Check version and create draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The release check reads ci.yml's runs.
      actions: read
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; a token left in .git/config would reach every later step.
          persist-credentials: false
          # The release check needs the tagged commit's parent and origin/main.
          fetch-depth: 0

      - name: Tag must match npn.version
        run: |
          version=$(sed -n 's/^npn\.version=//p' gradle.properties)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match npn.version=$version in gradle.properties. Use 'mise release <version>'."
            exit 1
          fi

      - name: Tagged commit passed CI, or only bumps a main commit that did
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-commit.sh

      - name: Decide the release channel
        id: channel
        run: |
          version=$(sed -n 's/^npn\.version=//p' gradle.properties)
          case "$version" in
            0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$TAG"
          channel=()
          if [ "${{ steps.channel.outputs.prerelease }}" = true ]; then
            title="$TAG (beta)"
            channel=(--prerelease)
          fi
          gh release create "$TAG" --draft --verify-tag --generate-notes "${channel[@]}" --title "$title"

  linux:
    name: Android and Linux packages
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; a token left in .git/config would reach every later step.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The APK bundles rclone, cross-compiled with Go and the NDK. It is built in a step of its own,
      # without the key and before it is decoded, so the Go toolchain and rclone's modules never run
      # with the key in their environment; the signing step below skips the task and packages what
      # this one built. No Go cache is restored, for the reason no Gradle cache is.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install Android NDK (for the bundled rclone)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865"

      - name: Cross-compile the bundled rclone
        run: ./gradlew --no-daemon --no-configuration-cache :androidApp:buildRcloneAndroid

      # The only step that sees the signing key, and the first to run Gradle with it, before any
      # packaging tool has run: the keystore is decoded here and deleted when the step ends. The run
      # leaves nothing holding the key behind either: no Gradle or Kotlin daemon to outlive the step
      # (their environment would still contain the password), no configuration cache entry with the
      # password in it.
      - name: Build signed APK
        env:
          NPN_KEYSTORE_BASE64: ${{ secrets.NPN_KEYSTORE_BASE64 }}
          NPN_KEYSTORE_PASSWORD: ${{ secrets.NPN_KEYSTORE_PASSWORD }}
          NPN_KEY_ALIAS: ${{ secrets.NPN_KEY_ALIAS }}
        run: |
          if [ -z "$NPN_KEYSTORE_BASE64" ]; then
            echo "::error::NPN_KEYSTORE_BASE64 secret is not set; see DEVELOPMENT.md 'Releases'."
            exit 1
          fi
          export NPN_KEYSTORE_FILE="$RUNNER_TEMP/npn-release.jks"
          trap 'rm -f "$NPN_KEYSTORE_FILE"' EXIT
          echo "$NPN_KEYSTORE_BASE64" | base64 --decode > "$NPN_KEYSTORE_FILE"
          ./gradlew --no-daemon --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            :androidApp:assembleRelease -x :androidApp:buildRcloneAndroid

      # Skipped above, the engine build could have left nothing to package, and the APK would still
      # build: without the engine, cloud sync would be "not installed" on every phone. Android runs
      # the engine from the installed native library directory, which holds it only when the
      # installer extracts it; an APK that stores it uncompressed (`useLegacyPackaging` off) keeps
      # it inside the APK, so the engine must be there and compressed.
      - name: Check the APK carries an extractable rclone
        run: |
          entry="$(unzip -v androidApp/build/outputs/apk/release/androidApp-release.apk | grep 'lib/arm64-v8a/librclone.so' || true)"
          if [ -z "$entry" ]; then
            echo "::error::The APK carries no lib/arm64-v8a/librclone.so"
            exit 1
          fi
          if echo "$entry" | grep -q ' Stored '; then
            echo "::error::librclone.so is stored uncompressed, so Android will not extract it to run"
            exit 1
          fi

      - name: Install rpmbuild and flatpak-builder
        run: |
          sudo apt-get update
          # elfutils carries eu-strip and eu-elfcompress, which flatpak-builder runs on every
          # module's libraries and fails without.
          sudo apt-get install --yes --no-install-recommends rpm flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build AppImage, deb, rpm and Linux tarball
        run: >-
          ./gradlew
          :desktopApp:packageAppImage
          :desktopApp:packageDeb
          :desktopApp:packageRpm
          :desktopApp:packageLinuxTarball

      - name: Check the bundled rclone
        run: bash .github/scripts/check-bundled-rclone.sh

      # Reuses the app image built above; also downloads the Flatpak SDK and compiles Tesseract.
      - name: Build Flatpak bundle
        run: .mise/tasks/package-flatpak

      # androidApp-release.apk only exists when signing succeeded; unsigned builds are named
      # androidApp-release-unsigned.apk, so a missing signature fails the copy below. The uploads
      # here and below replace an asset of the same name, so a re-run job overwrites what a failed
      # attempt already uploaded.
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/no-papers-needed-${TAG#v}.apk"
          cp desktopApp/build/appimage/*.AppImage desktopApp/build/appimage/*.AppImage.zsync dist/
          cp desktopApp/build/compose/binaries/main/deb/*.deb dist/
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm dist/
          cp desktopApp/build/flatpak/*.flatpak dist/
          cp desktopApp/build/linux-bundle/*.tar.gz dist/
          gh release upload "$TAG" --clobber dist/*

  windows:
    name: Windows installers
    needs: draft
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; a token left in .git/config would reach every later step.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # packageMsi/packageExe go straight to installers; createDistributable also leaves the app
      # image in build/compose/binaries/main/app for the Tesseract check below.
      - name: Package Windows installers (MSI + Exe)
        run: ./gradlew.bat :desktopApp:createDistributable :desktopApp:packageDistributionForCurrentOS

      - name: Check the bundled Tesseract
        shell: bash
        run: bash .github/scripts/check-bundled-tesseract.sh

      - name: Check the bundled rclone
        shell: bash
        run: bash .github/scripts/check-bundled-rclone.sh

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$TAG" --clobber
          desktopApp/build/compose/binaries/main/msi/*.msi
          desktopApp/build/compose/binaries/main/exe/*.exe

  publish:
    name: Checksums and publish
    needs: [draft, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Add SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          # A re-run also downloads the SHA256SUMS an earlier attempt uploaded; it is no package.
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # winget-pkgs takes a pull request per version. The first version has to be submitted by hand
  # (`komac new`), and the WINGET_TOKEN secret (a classic token with public_repo, for the fork of
  # microsoft/winget-pkgs that the PR comes from) must be set; without it this job only says so.
  # winget has no pre-releases, so a beta is never submitted: it would become the package every
  # winget user gets, and one skips this job outright.
  #
  # The action's composite step runs cargo-bins/cargo-binstall@main, so the repository's
  # allowed-actions policy names that repository and leaves "require SHA pinning" off; with either
  # missing, a stable release fails here at job setup, before the token is even checked.
  winget:
    name: Submit to winget
    needs: [publish, draft]
    if: needs.draft.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::WINGET_TOKEN is not set; skipping the winget submission."
          fi

      - name: Open winget-pkgs pull request
        if: steps.token.outputs.present == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: jeroenev.NoPapersNeeded
          release-tag: ${{ github.ref_name }}
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
