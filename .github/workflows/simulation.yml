name: Library simulation

# The deterministic simulation of several replicas sharing a library through a sync tool
# (docs/SIMULATION.md), run long. ci.yml runs its CI-sized seeds on every push; this runs on demand
# only, never on a schedule or a push: start it by hand after a change to the session, index,
# journal, file system or sync code. A long run takes up to half an hour. The run is time-boxed,
# and the traces upload only when a seed fails: a passing run's traces show nothing.
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: How many seeds to run (seeds * steps at most 32000, so a run fits in 30 minutes)
        required: false
        default: "60"
      steps:
        description: Steps per seed
        required: false
        default: "400"
      first_seed:
        description: The first seed (empty for a fresh block of seeds, picked by the date)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Simulate seeds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Choose the seeds
        id: seeds
        env:
          SEEDS: ${{ inputs.seeds }}
          STEPS: ${{ inputs.steps }}
          FIRST_SEED: ${{ inputs.first_seed }}
        run: bash .github/scripts/simulation-seeds.sh

      # Every failing seed is reported (up to all of them), each with the line that replays it.
      - name: Simulate
        timeout-minutes: 30
        run: >-
          ./gradlew :core:desktopTest --tests 'dev.npn.core.sim.LibrarySimulationTest*'
          -Dnpn.sim.firstSeed=${{ steps.seeds.outputs.first }}
          -Dnpn.sim.seeds=${{ steps.seeds.outputs.seeds }}
          -Dnpn.sim.steps=${{ steps.seeds.outputs.steps }}
          -Dnpn.sim.maxReported=${{ steps.seeds.outputs.seeds }}
          -Dnpn.sim.traceDir=${{ runner.temp }}/simulation-traces

      - name: Upload the traces and the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulation-traces-${{ steps.seeds.outputs.first }}
          path: |
            ${{ runner.temp }}/simulation-traces
            core/build/reports/tests/desktopTest
            core/build/test-results/desktopTest
          retention-days: 5
