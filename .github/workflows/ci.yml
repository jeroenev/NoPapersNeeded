name: CI

# Actions minutes and artifact storage are metered on this private repo, so this workflow keeps
# per-push work to what catches breakage: PRs check, test and compile; pushes to main also package;
# binaries are only uploaded on a manual run. Windows packaging lives in windows.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Shell scripts
        run: shellcheck .githooks/* .mise/tasks/* .github/scripts/*

      # Grouped into few Gradle invocations: each one pays configuration again.
      - name: Formatting, localization guard and static analysis
        run: ./gradlew spotlessCheck checkLocalization detekt

      # Desktop suites with coverage, then the same commonTest suites against the Android target
      # plus whatever only exists there (androidHostTest). Coverage stays on the desktop run.
      # buildSrc's own tests (the localization guard) never run as part of the main build, and
      # desktopApp's (the single-instance lock) would otherwise only run in the main-only build below.
      - name: Tests and coverage
        run: >-
          ./gradlew
          :composeApp:koverHtmlReportDesktop
          :composeApp:koverXmlReportDesktop
          :core:testAndroidHostTest
          :composeApp:testAndroidHostTest
          :buildSrc:test
          :desktopApp:test

      # detektTyped is detekt with type resolution: it needs the compiled classpaths, so it shares
      # this invocation instead of running with the source-only detekt above.
      - name: Compile (Android and desktop) and typed static analysis
        run: >-
          ./gradlew
          :core:compileAndroidMain
          :composeApp:compileKotlinDesktop
          :composeApp:compileAndroidMain
          compileDeviceTests
          detektTyped

      # KSP re-exports the Room schemas while compiling above. A difference means a schema change
      # whose export was not committed: device.db's DeviceDatabaseSchemaTest only guards what is.
      - name: Exported Room schemas are committed
        run: |
          changes="$(git status --porcelain -- core/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room schema exports differ from the committed ones; commit core/schemas:"
            echo "$changes"
            git diff -- core/schemas
            exit 1
          fi

      - name: Assemble APK, build and package desktop app
        if: github.event_name != 'pull_request'
        run: >-
          ./gradlew
          :androidApp:assembleDebug
          :desktopApp:assemble
          :desktopApp:packageAppImage

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

      - name: Upload AppImage
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: no-papers-needed-appimage
          path: desktopApp/build/appimage/*.AppImage
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            composeApp/build/reports/tests
            desktopApp/build/reports/tests
            buildSrc/build/reports/tests
          retention-days: 7

      # Artifact storage is metered: coverage is kept for main, and for a run that failed.
      - name: Upload coverage reports
        if: failure() || (success() && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kover-coverage-reports
          path: composeApp/build/reports/kover
          retention-days: 7
