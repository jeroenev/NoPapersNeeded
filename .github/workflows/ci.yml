name: CI

# Actions minutes and artifact storage are metered on this private repo, so this workflow keeps
# per-push work to what catches breakage: PRs check, test and compile; pushes to main also package;
# binaries are only uploaded on a manual run. Windows packaging lives in windows.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # The bundled rclone is cross-compiled with Go and the NDK into the APK, which the Android
      # builds below merge; caching Go's module and build caches keeps that step from downloading
      # rclone's whole dependency tree on every run.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Cache Go build and module caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: rclone-${{ runner.os }}-${{ hashFiles('androidApp/build.gradle.kts') }}
          restore-keys: rclone-${{ runner.os }}-

      - name: Install Android NDK (for the bundled rclone)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865"

      - name: Shell scripts
        run: shellcheck .githooks/* .mise/tasks/* .github/scripts/*

      # Grouped into few Gradle invocations: each one pays configuration again.
      - name: Formatting, localization and FieldType guards, and static analysis
        run: ./gradlew spotlessCheck checkLocalization checkFieldTypeBranches detekt

      # Desktop suites with coverage, then the same commonTest suites against the Android target
      # plus whatever only exists there (androidHostTest). Coverage stays on the desktop run.
      # buildSrc's tests (the localization guard) and detekt, and desktopApp's tests (the
      # single-instance lock), run only when named; nothing else in this workflow names them.
      - name: Tests and coverage
        run: >-
          ./gradlew
          :composeApp:koverHtmlReportDesktop
          :core:testAndroidHostTest
          :composeApp:testAndroidHostTest
          :buildSrc:test
          :buildSrc:detekt
          :desktopApp:test

      # Builds every module's Android code on the way (desktop compiled for the tests above).
      - name: Compile and device tests
        run: ./gradlew compileDeviceTests

      # detektTyped is detekt with type resolution over the compiled classpaths. The runner has
      # ~8 GB, so the Kotlin daemon left over from compiling is stopped first, and typed detekt and
      # Android lint each get their own invocation rather than sharing one.
      - name: Typed static analysis
        run: |
          pkill -f KotlinCompileDaemon || true
          ./gradlew detektTyped

      # lintDebug lints core and composeApp's Android code too.
      - name: Android lint
        run: ./gradlew :androidApp:lintDebug

      # KSP re-exports the Room schemas while compiling above. A difference means a schema change
      # whose export was not committed: device.db's DeviceDatabaseSchemaTest only guards what is.
      - name: Exported Room schemas are committed
        run: |
          changes="$(git status --porcelain -- core/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::Room schema exports differ from the committed ones; commit core/schemas:"
            echo "$changes"
            git diff -- core/schemas
            exit 1
          fi

      # packageAppImage builds the desktop jar on the way.
      - name: Assemble APK and package desktop app
        if: github.event_name != 'pull_request'
        run: >-
          ./gradlew
          :androidApp:assembleDebug
          :desktopApp:packageAppImage

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7

      - name: Upload AppImage
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: no-papers-needed-appimage
          path: desktopApp/build/appimage/*.AppImage
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            composeApp/build/reports/tests
            desktopApp/build/reports/tests
            buildSrc/build/reports/tests
            androidApp/build/reports/lint-results-debug.html
          retention-days: 7

      # Artifact storage is metered: coverage is kept for main, and for a run that failed.
      - name: Upload coverage reports
        if: failure() || (success() && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kover-coverage-reports
          path: composeApp/build/reports/kover
          retention-days: 7
