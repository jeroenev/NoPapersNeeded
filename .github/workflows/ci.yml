name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Shell scripts
        run: shellcheck .githooks/*

      - name: Localization guard
        run: ./gradlew checkLocalization

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Tests and coverage
        run: >-
          ./gradlew
          :composeApp:koverHtmlReportDesktop
          :composeApp:koverXmlReportDesktop

      # The same commonTest suites against the Android target, plus whatever only exists there
      # (androidHostTest). Coverage stays on the desktop run; this is about target-specific breakage.
      - name: Tests (Android target, host JVM)
        run: ./gradlew :core:testAndroidHostTest :composeApp:testAndroidHostTest

      - name: Compile core (Android)
        run: ./gradlew :core:compileAndroidMain

      - name: Compile composeApp (desktop)
        run: ./gradlew :composeApp:compileKotlinDesktop

      - name: Compile composeApp (Android)
        run: ./gradlew :composeApp:compileAndroidMain

      - name: Assemble Android debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build desktop app
        run: ./gradlew :desktopApp:build

      - name: Package Linux AppImage
        run: ./gradlew :desktopApp:packageAppImage

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: no-papers-needed-appimage
          path: desktopApp/build/appimage/*.AppImage

      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-reports
          path: core/build/reports/tests/desktopTest

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-reports
          path: composeApp/build/reports/kover
          if-no-files-found: error

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Formatting (Spotless)
        run: ./gradlew.bat spotlessCheck

      - name: Localization guard
        run: ./gradlew.bat checkLocalization

      - name: Static analysis (detekt)
        run: ./gradlew.bat detekt

      # Windows runners ship the Android SDK, but Android compilation is covered by the
      # ubuntu job; this job focuses on the desktop target where Windows-specific issues
      # (java.nio, jlink/jpackage/WiX) can surface.
      - name: Tests and coverage
        run: >-
          ./gradlew.bat
          :composeApp:koverHtmlReportDesktop
          :composeApp:koverXmlReportDesktop

      - name: Compile composeApp (desktop)
        run: ./gradlew.bat :composeApp:compileKotlinDesktop

      - name: Package Windows installers (MSI + Exe)
        run: ./gradlew.bat :desktopApp:packageDistributionForCurrentOS

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: no-papers-needed-windows-installers
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/exe/*.exe

      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-core-test-reports
          path: core/build/reports/tests/desktopTest
