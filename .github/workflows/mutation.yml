name: Mutation testing

# PIT over core's index and app packages (docs/MUTATION_TESTING.md). A run takes far
# longer than the per-commit checks and Actions minutes are metered, so it runs on demand only,
# never from ci.yml or a schedule: PIT writes its report only at the end, so a run the step's
# time-box cuts short costs its full minutes and shows nothing. The HTML report is the result; it
# is kept for a week.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated packages to mutate instead of the default (e.g. dev.npn.core.index)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing (core)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # The hosted runner has two cores and about 7 GB: one test process per core, each with up to
      # 768 MB of heap beside Gradle's. Cut off before the job's limit, so the report still uploads.
      - name: Mutation tests
        timeout-minutes: 165
        env:
          PACKAGES: ${{ inputs.packages }}
        run: ./gradlew :core:mutationTest -Pnpn.mutation.threads=2 ${PACKAGES:+"-Pnpn.mutation.packages=$PACKAGES"}

      - name: Upload the mutation report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: core/build/reports/pitest
          if-no-files-found: ignore
          retention-days: 7
