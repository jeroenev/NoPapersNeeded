version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Each io.nlopez.compose.rules release targets one detekt version, so they update together.
      detekt:
        patterns:
          - "dev.detekt*"
          - "io.nlopez.compose.rules*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
