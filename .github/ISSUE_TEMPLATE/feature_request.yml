name: Feature request
description: An idea to make the app better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the task, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working.
  - type: textarea
    id: alternatives
    attributes:
      label: How do you manage today?
