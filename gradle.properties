# The app version: the single source for Android, desktop and the About screen (see
# buildSrc/.../NpnVersion.kt). Bump it with `mise release <version>`, never by hand.
npn.version=0.1.0

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# A daemon keeps the class loaders of every build it ran (each worktree and buildSrc change adds
# more), so its metaspace is capped: Gradle then retires the daemon after a build once it nears
# the cap instead of growing without bound. The periodic GC hands an idle daemon's heap back.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1536m -XX:G1PeriodicGCInterval=300000 -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

android.nonTransitiveRClass=true
android.useAndroidX=true
