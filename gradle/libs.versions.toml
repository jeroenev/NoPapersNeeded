[versions]
agp = "9.3.1"
# The JDK that runs Gradle, compiles everything and is bundled with the desktop app.
jdk = "25"
# The bytecode every module targets. Android shares it and only offers newer Java library APIs on
# newer OS versions, so this stays below `jdk`; -Xjdk-release keeps desktop code from using them.
jvm-target = "17"
android-compileSdk = "37"
android-minSdk = "30"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-benchmark = "1.5.0"
androidx-core = "1.18.0"
androidx-documentfile = "1.1.0"
androidx-lifecycle = "2.11.0"
androidx-profileinstaller = "1.4.1"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-uiautomator = "2.4.0"
androidx-work = "2.11.2"
compose-material-icons = "1.7.3"
compose-material3 = "1.11.0-alpha07"
compose-navigation = "2.9.2"
# Back handling (system gesture, Esc on desktop); the JetBrains build carries the desktop actual.
compose-navigationevent = "1.0.1"
# The Compose ruleset for detekt; each release targets one detekt version (0.6.7: 2.0.0-alpha.6).
compose-rules = "0.6.7"
composeMultiplatform = "1.11.1"
coroutines = "1.11.0"
detekt = "2.0.0-alpha.6"
filekit = "0.14.2"
jna = "5.19.1"
kotlin = "2.4.10"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.11.0"
koog = "1.1.1"
# Koog clients not yet promoted to stable; they depend on the stable 1.1.1 base modules.
koog-beta = "1.1.1-beta"
kotest = "6.2.3"
kover = "0.9.9"
ksp = "2.3.11"
ktlint = "1.8.0"
ktor = "3.5.2"
mlkit-docscanner = "16.0.0"
mlkit-textrecognition = "16.0.1"
pdfbox = "3.0.8"
pdfbox-android = "2.0.27.0"
room3 = "3.0.1"
sqlite = "2.7.0"
spotless = "8.9.0"

[libraries]
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-lifecycle-runtimeCompose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "compose-rules" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
koog-agents-core = { module = "ai.koog:agents-core", version.ref = "koog" }
koog-agents-features-memory = { module = "ai.koog:agents-features-memory", version.ref = "koog" }
koog-agents-tools = { module = "ai.koog:agents-tools", version.ref = "koog" }
koog-http-client-ktor = { module = "ai.koog:http-client-ktor", version.ref = "koog" }
koog-prompt-executor-anthropic = { module = "ai.koog:prompt-executor-anthropic-client", version.ref = "koog" }
koog-prompt-executor-deepseek = { module = "ai.koog:prompt-executor-deepseek-client", version.ref = "koog-beta" }
koog-prompt-executor-google = { module = "ai.koog:prompt-executor-google-client", version.ref = "koog-beta" }
koog-prompt-executor-mistralai = { module = "ai.koog:prompt-executor-mistralai-client", version.ref = "koog-beta" }
koog-prompt-executor-model = { module = "ai.koog:prompt-executor-model", version.ref = "koog" }
koog-prompt-executor-ollama = { module = "ai.koog:prompt-executor-ollama-client", version.ref = "koog" }
koog-prompt-executor-openai = { module = "ai.koog:prompt-executor-openai-client", version.ref = "koog" }
koog-prompt-executor-openrouter = { module = "ai.koog:prompt-executor-openrouter-client", version.ref = "koog" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
mlkit-document-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "mlkit-docscanner" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-textrecognition" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "compose-navigation" }
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "compose-navigationevent" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox-android" }
pdfbox-xmpbox = { module = "org.apache.pdfbox:xmpbox", version.ref = "pdfbox" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

[plugins]
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidxBaselineProfile = { id = "androidx.baselineprofile", version.ref = "androidx-benchmark" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
